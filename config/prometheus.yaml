global:
  scrape_interval:     5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets:
          - 'prometheus:9090'
  
  - job_name: 'loki'
    dns_sd_configs:
      - names:
          - loki-read
          - loki-write
          - loki-backend
        type: A
        port: 3100
  
  - job_name: 'alloy'
    dns_sd_configs:
      - names:
          - alloy
        type: A
        port: 12345
        
  # Add this new job to scrape metrics from our exporter
  - job_name: 'http-metrics'
    static_configs:
      - targets:
          - 'metrics-exporter:8082'