networks:
  loki:

volumes:
  prometheus:
  grafana:
  alertmanager-data:
  alloy-data:

services:
  # Metrics exporter to convert logs to Prometheus metrics
  metrics-exporter:
    build: 
      context: ./scripts
      dockerfile: Dockerfile
    volumes:
      - ./loki/:/var/log/
    ports:
      - "127.0.0.1:8082:8082"
    networks:
      - loki
    depends_on:
      - log-generator



  grafana:
    image: grafana/grafana:13.3.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./config/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yml
      - grafana:/var/lib/grafana
      - ./config/dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/overview.json:ro
    networks:
      - loki

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "127.0.0.1:9090:9090"  # Exposing on a fixed port for easier access
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus:/prometheus
    command:
      [
        '--log.level=info',
        '--config.file=/etc/prometheus/prometheus.yml',
        '--web.enable-remote-write-receiver',
        '--query.lookback-delta=30s'
      ]
    networks:
      - loki

  # for testing purposes only, disable in production
  log-generator:
    image: mingrammer/flog:0.4.3
    command:
      - --loop
      - --format=json
      - --number=10  # number of log lines to generate per second
      - --delay=100ms  # delay between log lines
      - --output=/var/log/generated-logs.txt
      - --overwrite
      - --type=log
    volumes:
      - ./loki/:/var/log/
    networks:
      - loki

  alloy:
    image: grafana/alloy:v1.21.3
    command: ["run", "--storage.path=/var/lib/alloy", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    volumes:
      - ./loki:/var/log/generated:ro
      - ./config/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
    networks:
      - loki

  minio:
    image: pgsty/silo:RELEASE.2026-11-09T00-00-00Z
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler &&
        silo server --address "0.0.0.0:9000" --console-address "0.0.0.0:9001" /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./.data/minio:/data
    networks:
      - loki

  loki-gateway:
    image: nginx:1.30.7
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - loki

  loki-read:
    image: grafana/loki:3.7.8
    volumes:
      - ./config:/etc/loki/
    command: "-config.file=/etc/loki/loki.yaml -target=read -legacy-read-mode=false"
    networks:
      - loki
    restart: always
    deploy:
      replicas: 3

  loki-write:
    image: grafana/loki:3.7.8
    volumes:
      - ./config:/etc/loki/
    command: "-config.file=/etc/loki/loki.yaml -target=write"
    networks:
      - loki
    restart: always
    deploy:
      replicas: 3

  loki-backend:
    image: grafana/loki:3.7.8
    volumes:
      - ./config:/etc/loki/
      - ./rules:/loki/rules:ro
    command: "-config.file=/etc/loki/loki.yaml -target=backend -legacy-read-mode=false"
    networks:
      - loki
    restart: always
    deploy:
      replicas: 3

  # alertmanager to enable receiving alerts
  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - "./config:/config"
      - alertmanager-data:/data
    command: --config.file=/config/alertmanager.yml --log.level=info
    networks:
      - loki
